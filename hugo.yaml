baseURL: "https://blog.realbro.dev/"
title: "realbrolog"

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 1
  ko:
    languageName: "한국어"
    languageCode: "ko"
    weight: 2

module:
  mounts:
    - source: content/en
      target: content
      lang: en
    - source: posts-en
      target: content/posts
      lang: en
    - source: content/ko
      target: content
      lang: ko
    - source: posts-ko
      target: content/posts
      lang: ko

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  description: "Math, Programming, and Book Reviews"
  keywords:
    - Math
    - Programming
    - Book Reviews
  author: realbronoh

taxonomies:
  tag: tags

outputs:
  home:
    - HTML
    - RSS

markup:
  highlight:
    noClasses: false
